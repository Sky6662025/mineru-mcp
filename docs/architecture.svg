<svg viewBox="0 0 680 764" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MinerU v4 MCP Server 与 Client 的分层架构图</title>
<desc>自上而下六层：Agent 客户端层、MCP 传输层、server.py 工具层、mineru_client.py 封装层、MinerU v4 REST API、部署形态。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.tt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:500}
.tb{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400}
.tm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
</defs>
<rect x="0" y="0" width="680" height="764" fill="#FFFFFF"/>

<text class="tt" x="40" y="30" font-size="15" fill="#0C447C">MinerU v4 MCP 架构</text>
<text class="tb" x="640" y="30" font-size="12" fill="#5F5E5A" text-anchor="end">19 tools · 18 REST 操作 · mcp 1.x</text>
